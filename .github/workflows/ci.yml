name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege: nothing here needs write access to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck and site invariants
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Typecheck Cloudflare Worker
        run: npm run typecheck

      - name: Check site invariants
        run: npm run check:site

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  audit:
    name: Lighthouse and accessibility
    runs-on: ubuntu-latest
    # Advisory while budgets are being calibrated. Flip to a required check
    # (and drop this line) once the thresholds in lighthouserc.json hold steady.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun
