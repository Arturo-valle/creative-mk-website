    <!-- Same cross-document View Transition opt-in the homepage carries
         (css/stage.css): both documents must declare it for the crossfade to
         run. Firefox ignores it; reduced motion disables it. -->
    <style>
      @view-transition { navigation: auto; }
      ::view-transition-old(root) { animation-duration: 0.22s; }
      ::view-transition-new(root) { animation-duration: 0.28s; }
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) { animation: none !important; }
      }
    </style>
